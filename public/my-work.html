<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HFN · My Work</title><link rel="stylesheet" href="/styles.css"><link rel="stylesheet" href="/my-work.css"></head><body><main><header><div><p class="eyebrow">HFN PROCESSING</p><h1 id="workspace-title">My Work</h1><p class="sub" id="viewer">Loading secure work queue…</p></div><form method="post" action="/auth/logout"><button>Log out</button></form></header><section class="panel"><div class="section-heading"><div><p class="eyebrow">PRIORITIZED WORK</p><h2>What needs work now</h2></div><div class="work-tools"><select id="owner" hidden aria-label="Employee filter"></select><button id="add-task" type="button">+ Add Task</button></div></div><div id="work"></div></section></main><dialog id="manual-task-dialog"><form id="manual-task-form"><div class="dialog-heading"><h2>Add Task</h2><button type="button" id="close-task-dialog" aria-label="Close">×</button></div><label>Loan<select id="manual-loan" required></select></label><label>Task title<input id="manual-title" maxlength="160" required></label><label>Assignee<select id="manual-assignee" required></select></label><label>Due date/time<input id="manual-due" type="datetime-local" required></label><label>Priority<select id="manual-priority"><option value="normal">Normal</option><option value="high">High</option><option value="urgent">Urgent</option></select></label><label>Optional note<textarea id="manual-note" maxlength="1000"></textarea></label><div class="dialog-actions"><button type="button" id="cancel-task-dialog">Cancel</button><button type="submit" class="primary-action">Create task</button></div></form></dialog><script type="module" src="/my-work.js"></script></body></html>
